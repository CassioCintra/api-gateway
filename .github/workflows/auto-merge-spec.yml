name: Auto Merge OpenAPI Spec PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [development]

jobs:
  auto-merge:
    name: Auto merge spec update
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'openapi/')

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --auto \
            --subject "docs(openapi): ${{ github.head_ref }}" \
            --delete-branch
