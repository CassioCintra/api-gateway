# Template para microsserviços — copiar para .github/workflows/update-gateway-spec.yml
# de cada microsserviço e ajustar SERVICE_NAME abaixo.
#
# Pré-requisitos no repositório do microsserviço:
#   1. Secret GATEWAY_PAT: Personal Access Token com permissão contents:write no repositório do gateway.
#   2. springdoc-openapi-maven-plugin configurado no pom.xml (ver snippet abaixo).
#
# Snippet pom.xml — adicionar dentro de <build><plugins>:
#
#   <plugin>
#     <groupId>org.springframework.boot</groupId>
#     <artifactId>spring-boot-maven-plugin</artifactId>
#     <executions>
#       <execution>
#         <id>pre-integration-test</id>
#         <goals><goal>start</goal></goals>
#         <configuration>
#           <arguments>
#             <argument>--server.port=8080</argument>
#           </arguments>
#         </configuration>
#       </execution>
#       <execution>
#         <id>post-integration-test</id>
#         <goals><goal>stop</goal></goals>
#       </execution>
#     </executions>
#   </plugin>
#
#   <plugin>
#     <groupId>org.springdoc</groupId>
#     <artifactId>springdoc-openapi-maven-plugin</artifactId>
#     <version>1.5</version>
#     <executions>
#       <execution>
#         <goals><goal>generate</goal></goals>
#       </execution>
#     </executions>
#     <configuration>
#       <outputDir>${project.build.directory}</outputDir>
#       <outputFileName>openapi.yaml</outputFileName>
#       <apiDocsUrl>http://localhost:8080/v3/api-docs.yaml</apiDocsUrl>
#     </configuration>
#   </plugin>

name: Update OpenAPI Spec in Gateway

on:
  push:
    branches: [main]
    paths:
      - 'src/main/**'

env:
  # ── Ajustar por microsserviço ──────────────────────────────────────────────
  SERVICE_NAME: ms-feature-flags          # deve corresponder ao nome do arquivo em static/openapi/
  GATEWAY_REPO: CassioCintra/gateway
  GATEWAY_BRANCH: development
  JAVA_VERSION: '25'
  # ──────────────────────────────────────────────────────────────────────────

jobs:
  update-spec:
    name: Generate and push OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout microservice
        uses: actions/checkout@v6.0.2

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Generate OpenAPI spec
        run: ./mvnw verify -DskipTests

      - name: Checkout gateway
        uses: actions/checkout@v6.0.2
        with:
          repository: ${{ env.GATEWAY_REPO }}
          token: ${{ secrets.GATEWAY_PAT }}
          path: gateway

      - name: Verify if the spec changes
        id: diff
        run: |
          CURRENT="gateway/src/main/resources/static/openapi/${{ env.SERVICE_NAME }}.yaml"
          if cmp -s target/openapi.yaml "$CURRENT"; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Copy spec upgraded
        if: steps.diff.outputs.changed == 'true'
        run: |
          cp target/openapi.yaml \
            gateway/src/main/resources/static/openapi/${{ env.SERVICE_NAME }}.yaml

      - name: Open PR on Gateway repository
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GATEWAY_PAT }}
          path: gateway
          base: ${{ env.GATEWAY_BRANCH }}
          branch: openapi/${{ env.SERVICE_NAME }}
          commit-message: "docs(openapi): update ${{ env.SERVICE_NAME }} spec"
          title: "docs(openapi): update ${{ env.SERVICE_NAME }} OpenAPI spec"
          body: |
            Atualização automática do spec OpenAPI de `${{ env.SERVICE_NAME }}`.

            **Commit de origem:** ${{ github.sha }}
            **Repositório:** ${{ github.repository }}
          labels: |
            documentation
            automated
