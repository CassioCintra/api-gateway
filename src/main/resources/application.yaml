#file: noinspection YAMLSchemaValidation
spring:
  application:
    name: gateway
  docker:
    compose:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${MS_AUTH_ISSUER_URI:http://ms-auth:9000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 30s
          routes:

            # ── ms-auth ───────────────────────────────────────────────────────────
            - id: ms-auth
              uri: ${MS_AUTH_URI:http://ms-auth:9000}
              predicates:
                - Path=/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_AUTH_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_AUTH_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@authorizationHeaderKeyResolver}"

            # ── ms-feature-flags ──────────────────────────────────────────────────
            - id: ms-feature-flags
              uri: ${MS_FEATURE_FLAGS_URI:http://ms-feature-flags:8081}
              predicates:
                - Path=/flags/**
              filters:
                - RewritePath=/flags/(?<segment>.*), /feature-flag/v1/$\{segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_FLAGS_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${RATE_FLAGS_BURST:40}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@authorizationHeaderKeyResolver}"

            # ── ms-workspace-management — workspaces ──────────────────────────────
            - id: ms-workspace-workspaces
              uri: ${MS_WORKSPACE_URI:http://ms-workspace-management:8082}
              predicates:
                - Path=/workspaces/**
              filters:
                - RewritePath=/workspaces/(?<segment>.*), /users/v1/workspaces/$\{segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_WORKSPACES_REPLENISH:30}
                    redis-rate-limiter.burstCapacity: ${RATE_WORKSPACES_BURST:60}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@authorizationHeaderKeyResolver}"

            # ── ms-workspace-management — tokens ──────────────────────────────────
            - id: ms-workspace-tokens
              uri: ${MS_WORKSPACE_URI:http://ms-workspace-management:8082}
              predicates:
                - Path=/tokens/**
              filters:
                - RewritePath=/tokens/(?<segment>.*), /users/v1/tokens/$\{segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_TOKENS_REPLENISH:10}
                    redis-rate-limiter.burstCapacity: ${RATE_TOKENS_BURST:20}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@authorizationHeaderKeyResolver}"

            # ── ms-dashboard ──────────────────────────────────────────────────────
            # Serviço ainda não implementado (Fase 6). Porta e context-path a confirmar.
            - id: ms-dashboard
              uri: ${MS_DASHBOARD_URI:http://ms-dashboard:8083}
              predicates:
                - Path=/dashboard/**
              filters:
                - RewritePath=/dashboard/(?<segment>.*), /dashboard/v1/$\{segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_DASHBOARD_REPLENISH:30}
                    redis-rate-limiter.burstCapacity: ${RATE_DASHBOARD_BURST:60}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@authorizationHeaderKeyResolver}"

            # ── ms-audit ──────────────────────────────────────────────────────────
            # Serviço ainda não implementado (Fase 5). Porta e context-path a confirmar.
            - id: ms-audit
              uri: ${MS_AUDIT_URI:http://ms-audit:8084}
              predicates:
                - Path=/audit/**
              filters:
                - RewritePath=/audit/(?<segment>.*), /audit/v1/$\{segment}
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${RATE_AUDIT_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${RATE_AUDIT_BURST:40}
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@authorizationHeaderKeyResolver}"

auth:
  public-issuer-uri: ${AUTH_PUBLIC_ISSUER_URI:http://localhost:9000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    persist-authorization: true
    oauth2-redirect-url: ${GATEWAY_PUBLIC_URL:http://localhost:8090}/swagger-ui/oauth2-redirect.html
    oauth:
      client-id: swagger-ui
      use-pkce-with-authorization-code-grant: true
    urls:
      - name: ms-auth
        url: /openapi/ms-auth.yaml
      - name: ms-feature-flags
        url: /openapi/ms-feature-flags.yaml
      - name: ms-workspace-management
        url: /openapi/ms-workspace-management.yaml
      - name: ms-audit
        url: /openapi/ms-audit.yaml
      - name: ms-dashboard
        url: /openapi/ms-dashboard.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlator}] %-5level %logger{0} - %msg%n"
  level:
    io.github.cassio: DEBUG

server:
  port: 8090
