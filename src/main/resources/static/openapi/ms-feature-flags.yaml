openapi: 3.1.0
info:
  title: ms-feature-flags
  version: 0.0.1
servers:
- url: http://localhost:8081/feature-flag/v1
  description: Local
paths:
  /flags:
    get:
      tags:
      - feature-flag-controller
      operationId: listFlags
      parameters:
      - name: service
        in: query
        required: false
        schema:
          type: string
      - name: env
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - BOOLEAN
          - ROLLOUT
          - MULTIVARIATE
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureFlagResponse"
    post:
      tags:
      - feature-flag-controller
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlagRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FeatureFlagResponse"
  /flags/evaluate-batch:
    post:
      tags:
      - feature-flag-controller
      operationId: evaluateBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateBatchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/EvaluationResponse"
  /flags/{key}:
    delete:
      tags:
      - feature-flag-controller
      operationId: delete
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
    patch:
      tags:
      - feature-flag-controller
      operationId: patch
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchFlagRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FeatureFlagResponse"
  /services:
    get:
      tags:
      - feature-flag-controller
      operationId: getServices
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceFlagsResponse"
  /flags/{key}/evaluate:
    get:
      tags:
      - feature-flag-controller
      operationId: evaluate
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: query
        required: false
        schema:
          type: string
      - name: env
        in: query
        required: false
        schema:
          type: string
      - name: allParams
        in: query
        required: true
        schema:
          type: object
          additionalProperties:
            type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EvaluationResponse"
components:
  schemas:
    CreateFlagRequest:
      type: object
      properties:
        flagName:
          type: string
        serviceName:
          type: string
        type:
          type: string
          enum:
          - BOOLEAN
          - ROLLOUT
          - MULTIVARIATE
        rollout:
          type: integer
          format: int32
        environments:
          type: object
          additionalProperties:
            type: boolean
        tags:
          type: array
          items:
            type: string
        owner:
          type: string
        expiresAt:
          type: string
          format: date
    FeatureFlagResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        flagName:
          type: string
        serviceName:
          type: string
        type:
          type: string
          enum:
          - BOOLEAN
          - ROLLOUT
          - MULTIVARIATE
        rollout:
          type: integer
          format: int32
        environments:
          type: object
          additionalProperties:
            type: boolean
        tags:
          type: array
          items:
            type: string
        owner:
          type: string
        expiresAt:
          type: string
          format: date
        enabled:
          type: boolean
    EvaluateBatchRequest:
      type: object
      properties:
        keys:
          type: array
          items:
            type: string
        userId:
          type: string
        env:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
    EvaluationResponse:
      type: object
      properties:
        flagName:
          type: string
        enabled:
          type: boolean
        type:
          type: string
          enum:
          - BOOLEAN
          - ROLLOUT
          - MULTIVARIATE
        rollout:
          type: integer
          format: int32
    PatchFlagRequest:
      type: object
      properties:
        type:
          type: string
          enum:
          - BOOLEAN
          - ROLLOUT
          - MULTIVARIATE
        rollout:
          type: integer
          format: int32
        environments:
          type: object
          additionalProperties:
            type: boolean
        tags:
          type: array
          items:
            type: string
        owner:
          type: string
        expiresAt:
          type: string
          format: date
        enabled:
          type: boolean
    ServiceFlagsResponse:
      type: object
      properties:
        serviceName:
          type: string
        flags:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlagResponse"
